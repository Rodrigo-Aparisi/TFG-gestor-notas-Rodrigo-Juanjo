name: CI

on:
  push:
    branches: [main, rodrigo, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — test & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run tests with coverage
        run: npx jest --coverage --passWithNoTests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-ci-pipeline-only-32chars
          DB_HOST: localhost
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npx react-scripts test --watchAll=false --passWithNoTests --ci
        working-directory: frontend
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:3001/api

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:3001/api
